services:
  web:
    build: .
    image: twolate:local
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      TWOLATE_SECRET: ${TWOLATE_SECRET:-change-me-in-production}
    volumes:
      - twolate-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  twolate-data:
